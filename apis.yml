aid: icf-international
name: ICF (ICF International)
description: >-
  ICF (NASDAQ: ICFI), formerly ICF International, is a global consulting and
  digital services firm headquartered in Reston, Virginia, delivering management,
  technology, and policy consulting to US federal agencies, state and local
  governments, utilities, and commercial clients. ICF serves markets spanning
  government, energy, environment, infrastructure, transportation, health,
  education, social programs, public safety, and disaster management, with
  approximately 9,000 employees worldwide. The firm has invested in an in-house
  AI offering branded "ICF Fathom," but no public REST APIs, developer portal,
  SDKs, or technical documentation have been identified. ICF's work is delivered
  under contract rather than through a productized developer platform.
